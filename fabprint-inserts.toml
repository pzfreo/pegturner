name = "peg-turner-inserts"

[pipeline]
stages = ["load", "arrange", "plate", "slice"]

[printer]
name = "workshop"

[plate]
size = [256, 256]
padding = 5.0

[slicer]
engine = "orca"
version = "2.3.1"
bed_type = "Textured PEI Plate"

[slicer.orca]
printer = "Bambu Lab P1S 0.4 nozzle"
process = "0.20mm Standard @BBL X1C"

[slicer.orca.slots]
# Single filament: OrcaSlicer 2.3.1 segfaults in CI when loaded with
# a multi-slot filament list for this machine/process combo. TPU was
# previously slot 5 (external spool) — remap at print time.
1 = "Bambu TPU 95A @base"

[slicer.orca.overrides]
sparse_infill_density = "100%"
sparse_infill_pattern = "rectilinear"

[[parts]]
file = "peg_insert_2_0.step"
copies = 1
rotate = [180, 0, 0]
filament = 1

[[parts]]
file = "peg_insert_2_5.step"
copies = 1
rotate = [180, 0, 0]
filament = 1
